# Test fixture (no annotations): the blackhole backend plus two Ingresses
# (class "nginx"), read by both ingress-nginx and Traefik's Kubernetes Ingress
# NGINX provider.
#
#   kubectl apply -f manual.yaml
#   kubectl -n connect-timeout wait --for=condition=Ready pod -l app=blackhole --timeout=120s
#
# Add annotations per test (see TEST-RUNBOOK.md). Defaults:
#   ingress-nginx connect timeout = 5s; Traefik provider = 60s (override to 5).
---
apiVersion: v1
kind: Namespace
metadata:
  name: connect-timeout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackhole
  namespace: connect-timeout
  labels:
    app: blackhole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackhole
  template:
    metadata:
      labels:
        app: blackhole
    spec:
      containers:
        - name: blackhole
          image: alpine:3.20
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - sh
            - -c
            - |
              apk add --no-cache iptables >/dev/null 2>&1
              iptables -A INPUT -p tcp --dport 80 -j DROP
              echo "blackhole ready: SYN to tcp/80 is dropped"
              sleep infinity
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command: ["sh", "-c", "iptables -C INPUT -p tcp --dport 80 -j DROP"]
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: blackhole
  namespace: connect-timeout
  labels:
    app: blackhole
spec:
  selector:
    app: blackhole
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Read by ingress-nginx (class "nginx").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackhole-nginx
  namespace: connect-timeout
spec:
  ingressClassName: nginx
  rules:
    - host: nginx-connect.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackhole
                port:
                  number: 80
---
# Read by Traefik's Kubernetes Ingress NGINX provider (class "nginx").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackhole-traefik
  namespace: connect-timeout
spec:
  ingressClassName: nginx
  rules:
    - host: traefik-connect.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackhole
                port:
                  number: 80
