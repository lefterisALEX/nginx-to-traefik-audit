apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackhole-nginx
  namespace: connect-timeout
  annotations:
    # The timeout under test: nginx drops the upstream connection attempt after
    # this many seconds when no TCP handshake is possible.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "__CONNECT_TIMEOUT__"
    # Disable upstream retries so a single connect attempt is observed. Without
    # this, ingress-nginx's default proxy-next-upstream-tries: 3 multiplies the
    # measured time by the timeout (e.g. 3s becomes ~9s).
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: nginx-connect.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackhole
                port:
                  number: 80
